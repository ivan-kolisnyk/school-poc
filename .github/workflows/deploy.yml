name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 10:00 UTC = 4-5 am Chicago: expired alerts and past events drop off before school.
    - cron: '0 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Last good calendar copy: a fresh key every run, newest cache restored by prefix and re-saved.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-fetch-${{ github.run_id }}
          restore-keys: |
            eleventy-fetch-
      - run: npm run build:ci
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  a11y:
    needs: build
    runs-on: ubuntu-latest
    # Reports problems for an admin to review; never blocks publishing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-fetch-${{ github.run_id }}
          restore-keys: |
            eleventy-fetch-
      - run: npx playwright install --with-deps chromium
      # The static server maps /school-poc/ to _site, so build with that fixed prefix.
      - run: npm run build:ci
        env:
          PATH_PREFIX: /school-poc/
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/a11y.json
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
